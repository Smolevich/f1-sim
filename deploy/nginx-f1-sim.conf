server {
    listen 80;
    listen [::]:80;
    server_name games.smolevich.com;

    access_log /var/log/nginx/f1-sim.access.log;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # В корне — лендинг с выбором игры, каждая игра в своём подкаталоге.
    # Так новая игра добавляется каталогом и плиткой, без правки конфига.
    root /var/www/games;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # Игра — SPA: неизвестный путь внутри неё отдаём её index.html.
    location /f1/ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /f1/index.html;
    }

    location /api/ {
        # Без слеша на конце: путь уходит в uvicorn как есть. Со слешем nginx
        # срезал бы префикс /api/, а роуты в приложении объявлены с ним.
        # 8095 занят cat-game на этом же хосте, поэтому 8096.
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /f1/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
