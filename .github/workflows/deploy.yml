name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'deploy/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-f1-sim
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, test, build
        run: |
          npm ci
          npm test
          npm run build

      - name: API tests
        working-directory: api
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync
          uv run pytest -q

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-runner

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_PASSPHRASE }}
          source: dist/**,api/**,deploy/nginx-f1-sim.conf,deploy/f1-sim-api.service
          target: /tmp/deploy-f1-sim

      - name: Install static site, nginx vhost and API
        uses: appleboy/ssh-action@v1.2.5
        env:
          VAULT_DEPLOY_TOKEN: ${{ secrets.VAULT_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_PASSPHRASE }}
          envs: VAULT_DEPLOY_TOKEN
          script: |
            set -e
            WEB_DIR=/var/www/f1-sim
            RELEASE_DIR=/tmp/f1-sim-web-release

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            cp -a /tmp/deploy-f1-sim/dist/. "$RELEASE_DIR/"

            sudo rm -rf "$WEB_DIR"
            sudo mkdir -p /var/www
            sudo mv "$RELEASE_DIR" "$WEB_DIR"
            # umask root на этом хосте оставляет дерево в 700 — nginx не пройдёт.
            sudo chown -R root:root "$WEB_DIR"
            sudo find "$WEB_DIR" -type d -exec chmod 755 {} +
            sudo find "$WEB_DIR" -type f -exec chmod 644 {} +
            sudo install -m 0644 /tmp/deploy-f1-sim/deploy/nginx-f1-sim.conf \
              /etc/nginx/sites-available/f1-sim.conf
            sudo ln -sfn /etc/nginx/sites-available/f1-sim.conf \
              /etc/nginx/sites-enabled/f1-sim.conf
            sudo nginx -t
            sudo systemctl reload nginx

            sudo mkdir -p /opt/f1-sim/api /opt/f1-sim/data /etc/f1-sim
            sudo cp -a /tmp/deploy-f1-sim/api/. /opt/f1-sim/api/
            sudo chown -R root:root /opt/f1-sim/api
            # .venv исключён: он не из репозитория, а chmod 644 на повторном
            # деплое снимает бит выполнения с uvicorn, и юнит падает с 203/EXEC.
            sudo find /opt/f1-sim/api -path /opt/f1-sim/api/.venv -prune -o \
              -type d -exec chmod 755 {} +
            sudo find /opt/f1-sim/api -path /opt/f1-sim/api/.venv -prune -o \
              -type f -exec chmod 644 {} +

            if ! command -v uv >/dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sudo env UV_INSTALL_DIR=/usr/local/bin sh
            fi
            cd /opt/f1-sim/api
            sudo uv sync --no-dev
            sudo chmod 755 /opt/f1-sim/api/.venv/bin/*

            # Соль для хеша IP — из Vault, не из gh-secrets и не из репо.
            export VAULT_ADDR=http://127.0.0.1:8200
            SALT=$(VAULT_TOKEN="$VAULT_DEPLOY_TOKEN" vault kv get -field=ip_salt secret/f1-sim/api 2>/dev/null || true)
            if [ -z "$SALT" ]; then
              SALT=$(openssl rand -hex 32)
              VAULT_TOKEN="$VAULT_DEPLOY_TOKEN" vault kv put secret/f1-sim/api ip_salt="$SALT"
            fi
            printf 'F1SIM_DB=/opt/f1-sim/data/leaderboard.db\nF1SIM_IP_SALT=%s\n' "$SALT" \
              | sudo tee /etc/f1-sim/env > /dev/null
            sudo chmod 600 /etc/f1-sim/env

            sudo install -m 0644 /tmp/deploy-f1-sim/deploy/f1-sim-api.service \
              /etc/systemd/system/f1-sim-api.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now f1-sim-api
            sudo systemctl restart f1-sim-api

            rm -rf /tmp/deploy-f1-sim
